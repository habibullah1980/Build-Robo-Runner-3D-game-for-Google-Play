name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build the game
        run: |
          npm ci
          npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          # portrait only, full screen game
          sed -i 's|android:launchMode="singleTask"|android:launchMode="singleTask"\n            android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          VERSION_CODE=$(( ${{ github.run_number }} + 0 ))
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${VERSION_CODE}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: robo-runner-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed AAB for Google Play
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/upload.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm upload.jks

      - name: Upload AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: robo-runner-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
