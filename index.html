<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a1660">
  <title>Robo Runner</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="game" aria-label="Robo Runner game"></canvas>

  <!-- Loading -->
  <div id="loading" class="screen center">
    <div class="logo"><span>ROBO</span><span class="c">RUNNER</span></div>
    <div class="loadbar"><i id="loadfill"></i></div>
  </div>

  <!-- Main menu -->
  <div id="menu" class="screen" hidden>
    <div class="menu-top">
      <div class="pill"><svg class="gear-ic" viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(16 16)"><g fill="#1b1240"><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(0)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(36)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(72)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(108)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(144)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(180)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(216)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(252)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(288)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(324)"/><circle r="12.2"/></g><g fill="#ffc83d"><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(0)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(36)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(72)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(108)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(144)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(180)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(216)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(252)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(288)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(324)"/><circle r="10.4"/></g><circle r="10.4" fill="url(#gg)"/><circle r="4" fill="#1b1240"/><circle r="2.4" fill="#8a5200"/></g><defs><radialGradient id="gg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3a6"/><stop offset=".5" stop-color="#ffc83d" stop-opacity=".2"/><stop offset="1" stop-color="#c27a00" stop-opacity=".8"/></radialGradient></defs></svg><span id="menu-gears">0</span></div>
      <div class="pill"><span class="lbl">BEST</span><span id="menu-best">0</span></div>
    </div>
    <div class="logo big"><span>ROBO</span><span class="c">RUNNER</span></div>
    <div class="menu-bottom">
      <button id="btn-play" class="btn-play pulse">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.2-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="#1b1240"/></svg>PLAY</button>
      <div class="menu-row">
        <button id="btn-sound" class="round pink" aria-label="Sound on or off">
          <svg id="ic-sound" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path id="ic-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
      </div>
      <p class="tip">Swipe left or right to switch lanes, up to jump, down to slide.</p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="pill"><svg class="gear-ic" viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(16 16)"><g fill="#1b1240"><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(0)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(36)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(72)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(108)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(144)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(180)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(216)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(252)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(288)"/><rect x="-3.6" y="-15.5" width="7.2" height="8" rx="1.6" transform="rotate(324)"/><circle r="12.2"/></g><g fill="#ffc83d"><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(0)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(36)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(72)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(108)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(144)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(180)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(216)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(252)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(288)"/><rect x="-2.4" y="-13.8" width="4.8" height="6" rx="1" transform="rotate(324)"/><circle r="10.4"/></g><circle r="10.4" fill="url(#gg)"/><circle r="4" fill="#1b1240"/><circle r="2.4" fill="#8a5200"/></g><defs><radialGradient id="gg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3a6"/><stop offset=".5" stop-color="#ffc83d" stop-opacity=".2"/><stop offset="1" stop-color="#c27a00" stop-opacity=".8"/></radialGradient></defs></svg><span id="hud-gears">0</span></div>
      <div class="score"><b id="hud-score">0</b><span id="hud-mult" class="mult">x1</span></div>
      <button id="btn-pause" class="round" aria-label="Pause">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.6"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.6"/></svg>
      </button>
    </div>
    <div id="powers" class="powers"></div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen center dim" hidden>
    <h2>Paused</h2>
    <button id="btn-resume" class="btn-play">RESUME</button>
    <button id="btn-quit" class="btn-sec">Main menu</button>
  </div>

  <!-- Game over -->
  <div id="over" class="screen center dim" hidden>
    <h2 id="over-title">Caught!</h2>
    <div class="card">
      <div class="row"><span>Score</span><b id="over-score">0</b></div>
      <div class="row"><span>Gears</span><b id="over-gears">0</b></div>
      <div class="row"><span>Best</span><b id="over-best">0</b></div>
    </div>
    <p id="over-new" class="newbest" hidden>New best score!</p>
    <button id="btn-again" class="btn-play">PLAY AGAIN</button>
    <button id="btn-home" class="btn-sec">Main menu</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
